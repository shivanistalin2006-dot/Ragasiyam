<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Archive — Puzzle of the Day</title>

  <!-- Google Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <a href="../index.html" class="brand-logo">
      <span class="brand-icon">🧩</span>
      <div>
        <div style="line-height: 1;">PUZZLE</div>
        <div style="font-size: 0.75rem; font-family: var(--font-heading); color: var(--warm-cream); letter-spacing: 0.1em;">OF THE DAY</div>
      </div>
    </a>

    <nav class="main-nav">
      <ul class="nav-links">
        <li><a href="../index.html" class="nav-link">🧩 Home</a></li>
        <li><a href="puzzle.html" class="nav-link">🎯 Daily Puzzle</a></li>
        <li><a href="archive.html" class="nav-link active">📅 Archive</a></li>
        <li><a href="stats.html" class="nav-link">📊 Stats</a></li>
        <li><a href="achievements.html" class="nav-link">🏆 Badges</a></li>
      </ul>

      <div class="header-controls">
        <button id="btn-sound-toggle" class="btn-icon" title="Toggle Sound">🔊</button>
        <button id="btn-dark-toggle" class="btn-icon" title="Toggle Sunset Mode">🌅</button>
      </div>
    </nav>
  </header>

  <!-- Archive Main Container -->
  <main class="page-container">
    <div class="page-title-banner">
      <h1 class="page-title">PUZZLE ARCHIVE</h1>
      <p class="page-subtitle">Revisit past daily challenges in Practice Mode or view your completion record.</p>
    </div>

    <!-- Status Legend Bar -->
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem;">
      <div class="archive-status-badge" style="background: var(--golden-yellow); color: var(--dark-brown);">✅ SOLVED</div>
      <div class="archive-status-badge" style="background: linear-gradient(135deg, #FFE082 0%, #F29A5A 100%); color: var(--dark-brown);">🌟 PERFECT</div>
      <div class="archive-status-badge" style="background: var(--dusty-pink); color: var(--warm-cream);">❌ MISSED</div>
      <div class="archive-status-badge" style="background: #AAA; color: #333;">🔒 LOCKED</div>
    </div>

    <!-- Calendar Matrix Grid -->
    <div id="archive-grid" class="archive-matrix">
      <!-- Rendered by JS -->
    </div>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <ul class="nav-list">
      <li class="nav-item"><a href="../index.html"><span class="nav-icon">🧩</span>Home</a></li>
      <li class="nav-item"><a href="puzzle.html"><span class="nav-icon">🎯</span>Puzzle</a></li>
      <li class="nav-item"><a href="archive.html" class="active"><span class="nav-icon">📅</span>Archive</a></li>
      <li class="nav-item"><a href="stats.html"><span class="nav-icon">📊</span>Stats</a></li>
      <li class="nav-item"><a href="achievements.html"><span class="nav-icon">🏆</span>Badges</a></li>
    </ul>
  </nav>

  <!-- JavaScript Stack -->
  <script src="../js/puzzles.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/timer.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/hints.js"></script>
  <script src="../js/streak.js"></script>
  <script src="../js/achievements.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
